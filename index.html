<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adrien Benichou — Portfolio</title>
  <meta name="description" content="CRM & Fan Experience dans le sport — AS Monaco FC, CNOSF / Paris 2024.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/hero.css">
</head>
<body>

  <section class="hero-stage" id="hero-stage">

    <div class="hero-topbar">
      <h1 class="hero-name">
        <span class="word w1">Adrien</span>
        <span class="word w2">Benichou</span>
      </h1>
      <div class="hero-badges">
        <div class="badge badge-a">
          <img src="assets/badge-asmonaco.png" alt="AS Monaco">
          <div class="sheen"><div class="sheen-fill"></div></div>
        </div>
        <div class="badge badge-b">
          <img src="assets/badge-cnosf.png" alt="CNOSF">
          <div class="sheen"><div class="sheen-fill"></div></div>
        </div>
      </div>
    </div>

    <div class="hero-goalwrap">
      <div class="goal-zoom" id="goal-zoom">
        <div class="hero-cage">
          <div class="cage-inner">
            <img class="cage-net" src="assets/cage-net.png" alt="">
            <img class="cage-hole" src="assets/cage-hole.png" alt="">
          </div>
        </div>
      </div>
      <div class="goal-glow"></div>
    </div>

    <div class="fx-wrap">
      <div class="streak streak-1"></div>
      <div class="streak streak-2"></div>
      <div class="streak streak-3"></div>
      <div class="shock shock-1"></div>
      <div class="shock shock-2"></div>
      <div class="flash"></div>
      <div class="ball">
        <img src="assets/ball.png" alt="">
      </div>
    </div>

    <div class="cta-hole">
      <div class="cta-inner" id="cta-inner">
        <a id="cta-desktop" class="cta-circle" href="https://adrien-benichou.softr.app/" target="_blank" rel="noopener">Découvrir mon portfolio</a>
      </div>
    </div>

    <div class="cta-mobile-wrap">
      <a id="cta-mobile" class="cta-pill" href="https://adrien-benichou.softr.app/" target="_blank" rel="noopener">Découvrir mon portfolio</a>
    </div>

    <div class="profile-photo" id="profile-photo">
      <div class="profile-photo-float">
        <div class="profile-photo-inner">
          <img src="assets/Photo Adrien.jpg" alt="Adrien Benichou" class="profile-photo-img">
        </div>
      </div>
    </div>

    <div class="stats-radar" id="stats-radar" aria-hidden="true">
      <div class="stats-radar-inner">
        <svg class="radar-svg" viewBox="0 0 160 160">
          <polygon class="radar-grid" points="80,18 133.7,49 133.7,111 80,142 26.3,111 26.3,49"></polygon>
          <polygon class="radar-grid" points="80,38.7 115.8,59.3 115.8,100.7 80,121.3 44.2,100.7 44.2,59.3"></polygon>
          <polygon class="radar-grid" points="80,59.3 97.9,69.7 97.9,90.3 80,100.7 62.1,90.3 62.1,69.7"></polygon>
          <line class="radar-axis" x1="80" y1="80" x2="80" y2="18"></line>
          <line class="radar-axis" x1="80" y1="80" x2="133.7" y2="49"></line>
          <line class="radar-axis" x1="80" y1="80" x2="133.7" y2="111"></line>
          <line class="radar-axis" x1="80" y1="80" x2="80" y2="142"></line>
          <line class="radar-axis" x1="80" y1="80" x2="26.3" y2="111"></line>
          <line class="radar-axis" x1="80" y1="80" x2="26.3" y2="49"></line>
          <polygon class="radar-data" points="80,18 133.7,49 133.7,111 80,142 26.3,111 26.3,49"></polygon>
          <text class="radar-label" x="80" y="11" text-anchor="middle">Digital</text>
          <text class="radar-label" x="139" y="47" text-anchor="start">Data</text>
          <text class="radar-label" x="139" y="116" text-anchor="start">Sport</text>
          <text class="radar-label" x="80" y="155" text-anchor="middle">Productif</text>
          <text class="radar-label" x="21" y="116" text-anchor="end">Autonome</text>
          <text class="radar-label" x="21" y="47" text-anchor="end">Créatif</text>
        </svg>
      </div>
    </div>

    <div class="dive-overlay" id="dive-overlay"></div>

  </section>

  <script src="assets/hero.js"></script>
</body>
</html>
